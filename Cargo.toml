[package]
name = "agent-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Switch Claude subscriptions while keeping conversations available to resume"
license = "MIT"
repository = "https://github.com/rust-js-lang/agent-relay"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
